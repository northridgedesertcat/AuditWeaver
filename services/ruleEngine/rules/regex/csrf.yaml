id: csrf_regex
name: CSRF Regex Repository
version: "1.0"
patterns:
  - id: csrf_marker
    enabled: true
    regex: '(?i)\bcsrf\b'
  - id: csrf_token_marker
    enabled: true
    regex: '(?i)\b(?:token|nonce|cookie|session)\b'
  - id: csrf_legacy_form_marker
    enabled: true
    regex: '(?i)\b(?:form|post|get)\b'
