id: sensitive_access_regex

name: Sensitive Resource Access Regex Repository

version: "1.0"


patterns:


  # =====================================
  # Authentication related endpoints
  #
  # Examples:
  # /admin
  # /administrator
  # /login
  # /signin
  # =====================================

  - id: authentication_endpoint

    enabled: true

    regex: '(?i)/(?:admin(?:istrator)?|login|signin|auth)(?:/|$|\?)'



  # =====================================
  # Sensitive credential files
  #
  # Examples:
  # password.txt
  # passwd
  # secret.key
  # =====================================

  - id: credential_file_access

    enabled: true

    regex: '(?i)/(?:password|passwd|shadow|secret|credentials?)(?:\.(?:txt|json|yaml|yml|xml|key|pem))?(?:/|$|\?)'



  # =====================================
  # API documentation exposure
  #
  # Examples:
  # /swagger
  # /openapi.json
  # /api-docs
  # =====================================

  - id: api_documentation_exposure

    enabled: true

    regex: '(?i)/(?:swagger(?:-ui)?|openapi(?:\.json)?|api-docs|graphql)(?:/|$|\?)'



  # =====================================
  # Version control metadata exposure
  #
  # Examples:
  # /.git/config
  # /.svn/entries
  # =====================================

  - id: repository_metadata_exposure

    enabled: true

    regex: '(?i)/\.(?:git|svn|hg)(?:/|$)'



  # =====================================
  # Backup file exposure
  #
  # Examples:
  # database.sql
  # backup.zip
  # config.bak
  # =====================================

  - id: backup_file_exposure

    enabled: true

    regex: '(?i)(?:/[^?]*(?:backup|backup_[0-9]+|dump|database|config|settings)[^?]*(?:\.zip|\.tar|\.gz|\.sql|\.bak|\.old)?)'