# Agent 模块运行配置
# 环境敏感值（brokers, input_topic, base_url, api_key, timeout, host, port, level）
# 由 common.env 注入，不在此文件中定义。

kafka:
  group_id: agent_analysis_group_v10022
  auto_offset_reset: earliest
  consumer_timeout_ms: 5000
  max_poll_records: 10
  # 分析结果由 agent 直接写入 MySQL analysis_report 表，不再经 Kafka 中转
  # 处理失败的消息发送到此死信队列
  dlq_topic: log.dlq

dify:
  endpoint: workflows/run
  response_mode: blocking

logging:
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: agent_analysis.log

process:
  batch_size: 5
  poll_interval_ms: 1000
  retry_times: 3
  retry_delay: 2
  retry_max_delay: 10
  # 抖动比例 [0,1),叠加随机等待 [0, 2×0.5)=1s,防多消费者并发重试惊群
  retry_jitter: 0.5

# Dify 熔断策略:连续 fail_max 条消息处理失败后熔断 reset_timeout 秒,
# 半开状态下连续 success_threshold 条成功才恢复(给 Dify 过载时喘息机会)
circuit_breaker:
  # 连续 3 条彻底失败(每条重试耗尽)即熔断:3 条 × 4 次真实调用 = 最多 12 次真实失败
  fail_max: 3
  reset_timeout: 30
  success_threshold: 2
