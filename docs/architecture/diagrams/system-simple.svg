er" style="fill:#edf3fc !important;stroke:#6484b3 !important" rx="0" ry="0" x="-164.8125" y="-97.25" width="329.625" height="194.5"/><g class="label" style="color:#203a5a !important" transform="translate(-125.296875, -89.25)"><rect/><foreignObject width="250.59375" height="178.5"><div style="color: rgb(32, 58, 90) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 329.625px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#203a5a !important" class="nodeLabel"><p><b>01  COLLECT AND NORMALIZE</b><br /><br />External log collectors<br />Kafka: receive and buffer logs<br />Logstash: parse log fields<br /><br />Output: structured logs</p></span></div></foreignObject></g></g><g class="node pipeline flowchart-label" id="system-simple-DETECT" data-look="classic" transform="translate(502.4375, -101.25)"><rect class="basic label-container" style="fill:#edf3fc !important;stroke:#6484b3 !important" rx="0" ry="0" x="-164.8125" y="-97.25" width="329.625" height="194.5"/><g class="label" style="color:#203a5a !important" transform="translate(-136.53125, -89.25)"><rect/><foreignObject width="273.0625" height="178.5"><div style="color: rgb(32, 58, 90) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 329.625px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#203a5a !important" class="nodeLabel"><p><b>02  DETECT AND ANALYZE</b><br /><br />RuleEngine: match attack rules<br />Dify worker: analyze suspicious logs<br />Dify platform: run AI workflows<br /><br />Output: rule events and AI reports</p></span></div></foreignObject></g></g><g class="node storage flowchart-label" id="system-simple-STORAGE" data-look="classic" transform="translate(840.0625, -101.25)"><rect class="basic label-container" style="fill:#e6f5f4 !important;stroke:#4e9892 !important" rx="0" ry="0" x="-164.8125" y="-97.25" width="329.625" height="194.5"/><g class="label" style="color:#164b48 !important" transform="translate(-133.203125, -89.25)"><rect/><foreignObject width="266.40625" height="178.5"><div style="color: rgb(22, 75, 72) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 329.625px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#164b48 !important" class="nodeLabel"><p><b>03  STORE LOGS</b><br /><br />Log storage service: Kafka workers<br />Elasticsearch: recent 7-day copy<br />ClickHouse: full archive from arrival<br /><br />MySQL: checkpoints and coverage</p></span></div></foreignObject></g></g><g class="node app flowchart-label" id="system-simple-WEB" data-look="classic" transform="translate(164.8125, 101.25)"><rect class="basic label-container" style="fill:#edf5ed !important;stroke:#6c9875 !important" rx="0" ry="0" x="-164.8125" y="-97.25" width="329.625" height="194.5"/><g class="label" style="color:#254c30 !important" transform="translate(-147.8984375, -89.25)"><rect/><foreignObject width="295.796875" height="178.5"><div style="color: rgb(37, 76, 48) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 329.625px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#254c30 !important" class="nodeLabel"><p><b>04  WEB WORKSPACE</b><br /><br />Next.js: dashboard and investigation UI<br />Django: authentication and APIs<br />Reports, log search, incident handling<br /><br />MySQL: users, incidents, AI reports</p></span></div></foreignObject></g></g><g class="node storage flowchart-label" id="system-simple-QUERY" data-look="classic" transform="translate(502.4375, 101.25)"><rect class="basic label-container" style="fill:#e6f5f4 !important;stroke:#4e9892 !important" rx="0" ry="0" x="-164.8125" y="-97.25" width="329.625" height="194.5"/><g class="label" style="color:#164b48 !important" transform="translate(-125.4296875, -89.25)"><rect/><foreignObject width="250.859375" height="178.5"><div style="color: rgb(22, 75, 72) !important; displa