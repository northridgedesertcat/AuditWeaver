services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.4.13
    profiles: [log-storage]
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CK_ADMIN_USER:-auditweaver_admin}
      CLICKHOUSE_PASSWORD: ${CK_ADMIN_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CK_HTTP_PORT:-18123}:8123"
    mem_limit: 4g
    cpus: 2
    volumes:
      - ck_data:/var/lib/clickhouse
      - ./config/clickhouse/resources.xml:/etc/clickhouse-server/config.d/resources.xml:ro
      - ./config/clickhouse/profiles.xml:/etc/clickhouse-server/users.d/profiles.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  zookeeper:
      image: confluentinc/cp-zookeeper:7.4.0
      container_name: zookeeper
      environment:
        - ZOOKEEPER_CLIENT_PORT=2181
      volumes:
        - zk_data:/var/lib/zookeeper/data
      healthcheck:
        test: ["CMD", "cub", "zk-ready", "localhost:2181", "10"]
        interval: 10s
        timeout: 15s
        retries: 12
        start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "${KAFKA_PORT:-29092}:${KAFKA_PORT:-29092}"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:${KAFKA_PORT:-29092}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 30s
  
  kafka-connect:
    build: ./config/kafka-connect
    container_name: kafka-connect
    hostname: kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "${KAFKA_CONNECT_PORT:-8083}:8083"

    environment:
      # Kafka
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092

      # REST API
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect

      # Worker
      CONNECT_GROUP_ID: connect-cluster

      # Internal Topics
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1

      # Converters
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      # Connector Plugins
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "${ES_PORT:-19200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data 
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: logstash
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./config/logstash/pipeline:/usr/share/logstash/pipeline
    environment:
      - KAFKA_TOPIC_RAW=${KAFKA_TOPIC_RAW:-log.raw}
      - KAFKA_TOPIC_STRUCTURED=${KAFKA_TOPIC_STRUCTURED:-log.structured}

  kibana:
    profiles: ["tools"]
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-auditweaver}
      MYSQL_USER: ${MYSQL_USER:-auditweaver}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-auditweaver}
      TZ: ${MYSQL_TZ:-Asia/Shanghai}
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:8.0-alpine
    container_name: redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ck_data:
  kafka_data:
    name: system_audit_kafka_data
  es_data:
    name: system_audit_es_data
  zk_data:
    name: system_audit_zk_data
  mysql_data:
    name: system_audit_mysql_data
  redis_data:
    name: system_audit_redis_data
