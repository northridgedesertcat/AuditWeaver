mappings:
  properties:
    event_id:
      type: keyword
    ip:
      type: ip
    path:
      type: keyword
    method:
      type: keyword
    status:
      type: integer
    user_agent:
      type: text
      fields:
        keyword:
          type: keyword
          ignore_above: 256
    detect_type:
      type: keyword
    risk_level:
      type: keyword
    risk_score:
      type: integer
    attack_type_ai:
      type: keyword
    summary:
      type: text
      fields:
        keyword:
          type: keyword
          ignore_above: 512
    reasoning:
      type: text
      fields:
        keyword:
          type: keyword
          ignore_above: 256
    recommendations:
      type: text
      fields:
        keyword:
          type: keyword
          ignore_above: 256
    log_timestamp:
      type: date
      format: epoch_millis
    analysis_timestamp:
      type: date
      format: epoch_millis
    ingestion_time:
      type: date
      format: epoch_millis
    dify_response:
      type: object
      enabled: false
    original_log:
      type: object
      enabled: false
settings:
  number_of_shards: 1
  number_of_replicas: 0
  analysis:
    analyzer:
      default:
        type: standard
