input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["${KAFKA_TOPIC_RAW:log.raw}"]
    group_id => "logstash-group"
    auto_offset_reset => "latest"
    codec => "plain"
  }
}


filter {

  uuid {
    target => "event_id"
  }


  grok {
    match => {
      "message" => '%{IP:ip} - - \[%{HTTPDATE:timestamp}\] "%{WORD:method} %{DATA:path} HTTP/%{NUMBER:http_version}" %{NUMBER:status} %{NUMBER:bytes} "%{DATA:referrer}" "%{DATA:user_agent}"'
    }
  }


  if "_grokparsefailure" in [tags] {

    # 补齐统一 DLQ 字段集,对齐 core/kafka/dlq.py 的 DlqProducer 格式
    mutate {
      add_field => {
        "failure_reason"            => "grok_parse_failed"
        "failed_stage"              => "logstash_parser"
        "source_topic"              => "${KAFKA_TOPIC_RAW:log.raw}"
        "error_type"                => "GrokParseFailure"
        "error_message"             => "log line did not match nginx combined pattern"
        "error_traceback"           => ""
        "dlq_status"                => "pending"
        "retry_count"               => "0"
        "log_source"                => "nginx"
        "[original_payload][raw]"   => "%{message}"
      }
    }

    # retry_count 转为 integer (add_field 生成字符串,需单独 convert)
    mutate {
      convert => { "retry_count" => "integer" }
    }

    # 统一 tags: 移除 Logstash 内部标记,改用 DLQ 标准标签
    mutate {
      remove_tag => ["_grokparsefailure"]
      add_tag => ["dlq", "logstash_parser"]
    }

    # 剥离 Logstash 元数据字段,避免 ES 动态映射污染
    mutate {
      remove_field => ["@version", "log"]
    }

  } else {


    date {
      match => [
        "timestamp",
        "dd/MMM/yyyy:HH:mm:ss Z"
      ]
      target => "@timestamp"
    }


    mutate {

      convert => {
        "status" => "integer"
        "bytes" => "integer"
      }


      add_field => {
        "log_source" => "nginx"
        "audit_user" => "%{ip}"
        "audit_event" => "%{method} %{path}"
        "[pipeline][rule_matching][status]" => "pending"
      }


      remove_field => [
        "message",
        "timestamp",
        "log"
      ]
    }
  }
}


output {


  if [failed_stage] == "logstash_parser" {


    kafka {
      bootstrap_servers => "kafka:9092"
      topic_id => "${KAFKA_TOPIC_DLQ:log.dlq}"
      codec => json
    }


  } else {


    kafka {
      bootstrap_servers => "kafka:9092"
      topic_id => "${KAFKA_TOPIC_STRUCTURED:log.structured}"
      codec => json
    }

  }


  stdout {
    codec => rubydebug
  }
}